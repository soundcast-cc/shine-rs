[package]
name = "shine-rs"
version = "0.1.3"
edition = "2021"
authors = ["Shon Wang <code@wshon.com>"]
description = "A pure Rust MP3 encoder based on the shine library, providing complete MPEG Layer III encoding functionality"
license = "LGPL-2.0"
repository = "https://github.com/wshon/shine-rs"
homepage = "https://github.com/wshon/shine-rs"
documentation = "https://docs.rs/shine-rs"
readme = "README.md"
keywords = ["mp3", "audio", "encoder", "codec", "shine"]
categories = ["multimedia::audio", "encoding"]

[features]
default = []
diagnostics = ["serde", "serde_json", "chrono"]

[dependencies]
thiserror = "1.0"
lazy_static = "1.4"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
log = "0.4"
hound = "3.5"

[dev-dependencies]
proptest = "1.4"
env_logger = "0.10"
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"


[[bench]]
name = "primitives"
harness = false
path = "benches/primitives_bench.rs"

[[bench]]
name = "quantization"
harness = false
path = "benches/quantization_bench.rs"

[[bench]]
name = "subband"
harness = false
path = "benches/subband_bench.rs"

[[bench]]
name = "mdct"
harness = false
path = "benches/mdct_bench.rs"

[[bench]]
name = "bitstream"
harness = false
path = "benches/bitstream_bench.rs"

[[bench]]
name = "encode_pipeline"
harness = false
path = "benches/encode_pipeline_bench.rs"